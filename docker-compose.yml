services:
  mysql:
    image: mysql:8.0
    container_name: assalam_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-assalam}
      MYSQL_USER: ${DB_USERNAME:-assalam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - assalam_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: assalam_app
    hostname: assalam_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8002}:8000"
      - "${VITE_PORT:-5175}:5173"
      - "${WHATSAPP_PORT:-3002}:3000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-assalam}
      DB_USERNAME: ${DB_USERNAME:-assalam_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      SERVER_HOST: "0.0.0.0"
      WHATSAPP_WEB_ENABLED: "true"
      WHATSAPP_WEB_HOST: "127.0.0.1"
      WHATSAPP_WEB_PORT: 3000
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      SESSION_DIR: "/var/www/html/storage/app/whatsapp-sidecar/sessions"
      WHATSAPP_WEB_SESSION_DIR: "/var/www/html/storage/app/whatsapp-sidecar/sessions"
      WHATSAPP_WEB_CHROME_PATH: "/usr/bin/chromium"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - assalam_net

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: assalam_tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro,z
      - /home/quixiq/.cloudflared/c995f4be-2d8d-4dac-ac32-8b5b519cb259.json:/etc/cloudflared/credentials.json:ro,z
    depends_on:
      - app
    networks:
      - assalam_net

volumes:
  mysql_data:
    driver: local

networks:
  assalam_net:
    driver: bridge
