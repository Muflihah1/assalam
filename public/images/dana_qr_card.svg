<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="100%" height="100%">
  <defs>
    <linearGradient id="danaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#118eea"/>
      <stop offset="100%" stop-color="#0b6db5"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b3b60" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="320" height="420" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- DANA Top Header -->
  <path d="M 10 30 Q 10 10 30 10 L 310 10 Q 330 10 330 30 L 330 80 L 10 80 Z" fill="url(#danaGrad)"/>

  <!-- DANA Logo Text -->
  <g transform="translate(30, 26)">
    <!-- Stylized DANA text -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">DANA</text>
    <circle cx="95" cy="18" r="4" fill="#60bdf7"/>
    <rect x="200" y="10" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.2"/>
    <text x="234" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">QRIS</text>
  </g>

  <!-- Merchant Info Container -->
  <text x="170" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">ASSALAM MEBEL</text>
  <text x="170" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">NMID: ID1026090622108 • Sumenep</text>

  <!-- QR Code Frame & Box -->
  <rect x="45" y="140" width="250" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Scannable QR Matrix Scaled -->
  <g transform="translate(56, 151) scale(6.16)">
    <path stroke="#0f172a" stroke-width="1" stroke-linecap="square" d="M4 4.5h7m1 0h3m2 0h1m2 0h1m2 0h2m1 0h7M4 5.5h1m5 0h1m1 0h3m5 0h1m5 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m3 0h1m1 0h2m5 0h1m2 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h3m4 0h1m1 0h2m1 0h1m1 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m2 0h1m3 0h4m2 0h1m2 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m2 0h3m2 0h1m1 0h5m1 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h2m1 0h5m1 0h3M4 12.5h1m1 0h2m1 0h3m1 0h1m3 0h2m1 0h3m3 0h1m2 0h1m1 0h2M4 13.5h3m1 0h2m6 0h1m3 0h1m1 0h2m1 0h2m1 0h1m3 0h1M4 14.5h1m2 0h2m1 0h2m2 0h1m1 0h1m1 0h1m1 0h2m2 0h3m1 0h1m1 0h2M5 15.5h1m2 0h1m2 0h2m4 0h2m3 0h3m3 0h1m3 0h1M4 16.5h1m5 0h2m1 0h2m4 0h1m1 0h1m7 0h2M6 17.5h1m2 0h1m1 0h3m1 0h3m1 0h5m2 0h1m3 0h3M6 18.5h1m2 0h2m1 0h1m3 0h1m1 0h1m2 0h1m1 0h4m1 0h1m1 0h3M4 19.5h2m3 0h1m2 0h1m1 0h1m1 0h2m1 0h2m4 0h1m1 0h1m3 0h1M4 20.5h2m1 0h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h4m1 0h3m1 0h1M8 21.5h1m2 0h2m4 0h1m1 0h1m2 0h1m1 0h1m2 0h1m1 0h3M4 22.5h1m5 0h4m1 0h1m3 0h4m2 0h1m1 0h2m1 0h1M6 23.5h1m4 0h1m3 0h2m3 0h4m1 0h1m1 0h2m1 0h1M5 24.5h3m1 0h4m4 0h1m1 0h4m1 0h7M12 25.5h2m3 0h2m3 0h1m1 0h1m3 0h5M4 26.5h7m1 0h6m2 0h2m1 0h2m1 0h1m1 0h2m1 0h1M4 27.5h1m5 0h1m1 0h2m1 0h1m6 0h3m3 0h2m1 0h2M4 28.5h1m1 0h3m1 0h1m3 0h1m3 0h1m2 0h1m2 0h5m1 0h1M4 29.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h4m2 0h3m1 0h3m2 0h1M4 30.5h1m1 0h3m1 0h1m1 0h1m2 0h1m6 0h2m3 0h1m2 0h1m1 0h1M4 31.5h1m5 0h1m4 0h5m2 0h1m1 0h1m1 0h1m1 0h2m1 0h1M4 32.5h7m1 0h3m2 0h1m4 0h3m1 0h1m1 0h1m2 0h1"/>
  </g>

  <!-- Center DANA icon badge inside QR -->
  <rect x="148" y="243" width="44" height="44" rx="10" fill="#118eea" stroke="#ffffff" stroke-width="3"/>
  <text x="170" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">DANA</text>

  <!-- Bottom Footer -->
  <text x="170" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">Scan via Aplikasi DANA, GoPay, OVO, BCA &amp; M-Banking</text>
</svg>
